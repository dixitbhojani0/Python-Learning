# ─────────────────────────────────────────────────────────────────────
#  config/mcp_registry.yaml
#
#  Connector enable/disable flags.
#  Adding a new connector = add a block here + register the class in
#  connectors/. Credentials come from .env (core/settings.py), timeouts
#  from connectors/base_connector.py HTTP_TIMEOUT.
# ─────────────────────────────────────────────────────────────────────

# asyncio.Semaphore cap across ALL connectors (thundering-herd protection)
max_concurrent_calls: 3

connectors:

  github:
    enabled: true
    type: github
    description: "GitHub REST API — PRs, issues, repos"

  jira:
    enabled: true
    type: jira
    description: "Jira Cloud REST API — tickets, sprints, boards"

  slack:
    enabled: true
    type: slack
    description: "Slack API — channel messages, notifications"

  confluence:
    enabled: true
    type: confluence
    description: "Confluence pages (Atlassian REST) — fetch wiki content"

  # DISABLED — flip enabled: true and implement a connector class to re-enable
  teams:
    enabled: false
    type: teams
    description: "Microsoft Teams (Graph API) — channel messages"

  # DISABLED — flip enabled: true and implement a connector class to re-enable
  drive:
    enabled: false
    type: drive
    description: "Google Drive API — list and read documents"
