# ─────────────────────────────────────────────────────────────────────
#  config/mcp_registry.yaml
#
#  All MCP (Model Context Protocol) connectors are registered here.
#  Agents never import connectors directly — they call by name via
#  the MCPRegistry class.
#
#  Adding a new tool = add a block here. Zero Python changes needed.
# ─────────────────────────────────────────────────────────────────────

# ── Global registry settings ──────────────────────────────────────────────────
# max_concurrent_calls: asyncio.Semaphore cap across ALL connectors.
# Prevents thundering-herd when many agents call connectors in parallel.
# Read by backend/mcp/registry.py — change here without touching Python code.
max_concurrent_calls: 3

connectors:

  # ── GitHub MCP Connector
  # Used by: pr_agent, cross_source_agent
  # API docs: https://docs.github.com/en/rest
  github:
    enabled: true
    type: github                    # maps to backend/mcp/github_connector.py
    description: "GitHub REST API — PRs, issues, repos, webhooks"
    base_url: "https://api.github.com"
    token_env: GITHUB_TOKEN         # reads from .env — never hardcoded
    available_tools:
      - search_prs
      - get_pr_details
      - list_open_prs
      - assign_reviewer
      - get_repo_info
    timeout_seconds: 10
    max_retries: 3

  # ── Jira MCP Connector
  # Used by: ticket_agent, risk_agent, cross_source_agent
  # API docs: https://developer.atlassian.com/cloud/jira/platform/rest/v3/
  jira:
    enabled: true
    type: jira                      # maps to backend/mcp/jira_connector.py
    description: "Jira Cloud REST API — tickets, sprints, boards"
    base_url_env: JIRA_BASE_URL     # reads from .env
    email_env: JIRA_EMAIL
    token_env: JIRA_TOKEN
    project_key_env: JIRA_PROJECT_KEY
    available_tools:
      - search_tickets
      - get_ticket_details
      - create_ticket
      - get_sprint_board
      - get_blocked_tickets
      - update_ticket_status
    timeout_seconds: 15
    max_retries: 3

  # ── Slack MCP Connector
  # Used by: cross_source_agent, notify_agent, risk_agent
  # API docs: https://api.slack.com
  slack:
    enabled: true
    type: slack                     # maps to backend/mcp/slack_connector.py
    description: "Slack API — channel messages, notifications"
    token_env: SLACK_BOT_TOKEN
    available_tools:
      - search_messages
      - get_channel_history
      - send_message
    timeout_seconds: 10
    max_retries: 2

  # ── Microsoft Teams MCP Connector
  # Used by: cross_source_agent (Slack + Teams cross-source correlation)
  # Real connector needs an Azure AD app (AZURE_TENANT_ID/CLIENT_ID/CLIENT_SECRET)
  # plus team_id + channel ids below.
  teams:
    enabled: false                  # DISABLED to reduce demo complexity — flip to true + provide Azure AD creds to re-enable
    type: teams                     # maps to backend/mcp/connectors/teams_connector.py
    description: "Microsoft Teams (Graph API) — channel messages, notifications"
    team_id: ""
    channels:                       # channel name -> Graph channel id (when real)
      default: ""
    available_tools:
      - search_messages
      - get_channel_history
      - send_message
      - list_members
    timeout_seconds: 15
    max_retries: 2

  # ── Google Drive MCP Connector
  # Used by: RAG ingestion / document source. Real connector uses GDRIVE_API_KEY.
  drive:
    enabled: false                  # DISABLED to reduce demo complexity — flip to true + provide GDRIVE creds to re-enable
    type: drive                     # maps to backend/mcp/connectors/drive_connector.py
    description: "Google Drive API — list and read documents for ingestion"
    api_key_env: GDRIVE_API_KEY
    available_tools:
      - list_files
      - read_file
    timeout_seconds: 15
    max_retries: 2

  # ── Confluence MCP Connector
  # Used by: cross_source / MCP gather (confluence_get_pages tool).
  # Real connector reuses the JIRA_* Atlassian credentials (same token works for
  # both); falls back to MockConfluenceConnector when those are placeholders.
  confluence:
    enabled: true
    type: confluence                # maps to backend/mcp/connectors/confluence_connector.py
    description: "Confluence pages (Atlassian REST) — fetch wiki content"
    available_tools:
      - get_pages
      - get_page_content
    timeout_seconds: 15
    max_retries: 2
