# config/slack_users.yaml
#
# Team registry: maps each person across Jira, Slack, and GitHub.
# Used by the backend to:
#   - DM the assignee in Slack after a ticket is created
#   - Resolve Jira account_id ↔ Slack user_id for notifications
#
# How to fill this in:
#   jira_account_id  → Jira Cloud: click a user's avatar → "Profile" → copy ID from URL
#   slack_user_id    → Slack: right-click username → "View profile" → "⋯" → "Copy member ID"
#   github_username  → GitHub username (for future reviewer assignment)
#
# Read fresh on every DM send — edit here, no restart needed.

team:
